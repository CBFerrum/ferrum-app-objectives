[package]
name = "ferrum-app-objectives"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Portfolio and objectives: objectives aligned to their parents, key results measured by check-ins, progress rolled up, and the projects and portfolios behind them"
repository = "https://github.com/CBFerrum/ferrum-app-objectives"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
# Key results measured from the records run a Studio query, as Metrics' metrics do.
ferrum-studio = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# Its tests link Projects' portfolios and projects (Projects' roles reach ERP's records), and check
# that its interface is a release the platform takes.
ferrum-app-erp = { git = "https://github.com/CBFerrum/ferrum-app-erp", branch = "main" }
ferrum-app-projects = { git = "https://github.com/CBFerrum/ferrum-app-projects", branch = "main" }
# Its connector with Metrics is tested on Metrics' certified metrics.
ferrum-app-metrics = { git = "https://github.com/CBFerrum/ferrum-app-metrics", branch = "main" }
ferrum-apps = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[lints.clippy]
# Deliberate patterns shared with the platform: sqlx row tuples.
type_complexity = "allow"

[profile.dev]
debug = "line-tables-only"
