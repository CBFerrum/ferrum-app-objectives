- name: KeyResultProject
  label: Project
  kind: child
  fields:
    - {name: project, type: link, to: Project, required: true, in_list: true}

- name: ObjectivePerson
  label: Person
  kind: child
  fields:
    - {name: person, type: email, required: true, in_list: true}

- name: OkrCycle
  label: Cycle
  label_plural: Cycles
  kind: master
  module: objectives
  title_field: cycle_name
  description: "A period objectives are set for (a quarter, a year): planned, then active, then closed, when every objective in it closes with its score and nothing in it changes again. Objectives that name no cycle fall in the default one."
  fields:
    - {name: cycle_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: starts_on, type: date, in_list: true}
    - {name: ends_on, type: date, in_list: true}
    - {name: status, type: select, options: [Planning, Active, Closed], default: Planning, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: is_default, type: check, label: Default, in_list: true, description: Objectives that name no cycle fall in it}
  rules:
    - {name: ends_on, check: "doc.ends_on == null || doc.starts_on == null || doc.ends_on >= doc.starts_on", message: "A cycle cannot end before it starts"}
  actions:
    - {name: start_cycle, label: Start It, permission: write, condition: "doc.status == 'Planning'"}
    - {name: close_cycle, label: Close It, permission: write, condition: "doc.status != 'Closed'", confirm: "Close the cycle? Each of its objectives closes with its score, and nothing in it changes after."}
  list: {columns: [cycle_name, starts_on, ends_on, status, is_default], sort: starts_on desc}

- name: Objective
  label: Objective
  label_plural: Objectives
  kind: master
  module: objectives
  title_field: title
  description: What is to be achieved in a period, aligned to an objective above it. Its progress is its key results' and the objectives under it, on average by their weights; closed, its score is graded on the workspace's scale.
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: owner, type: email, required: true, default_expr: "user.email", in_list: true, in_filter: true, description: "Who answers for it: whoever records it, unless they name someone"}
    - {name: parent, type: link, to: Objective, in_list: true, label: Aligned To, description: "An objective of a higher level, when both have one"}
    - {name: cycle, type: link, to: OkrCycle, in_list: true, in_filter: true, description: "The period it is set for; empty: the default cycle"}
    - {name: level, type: select, options: [Company, Team, Person], in_list: true, in_filter: true, description: "Company above Team above Person: an objective aligns to one of a higher level"}
    - {name: private, type: check, in_filter: true, description: "Only its owner and the people listed see it, its key results and check-ins"}
    - {name: people, type: table, of: ObjectivePerson, description: "Who else sees it when it is private: its team, or whom it is shared with"}
    - {name: portfolio, type: link, to: Portfolio, in_filter: true}
    - {name: starts_on, type: date, required: true, in_list: true}
    - {name: ends_on, type: date, required: true, in_list: true}
    - {name: weight, type: decimal, default: 1, description: "How much it counts towards the objective it is aligned to, against the others there; 0 for not at all"}
    - {name: progress, type: percent, read_only: true, no_copy: true, in_list: true}
    - {name: status, type: select, options: [Draft, Active, Closed], default: Active, no_copy: true, in_list: true, in_filter: true,
       description: "Draft: being written, takes no check-ins; Active: under way; Closed: scored by Close It, and kept as it closed"}
    - {name: score, type: percent, read_only: true, no_copy: true, description: "Its progress when it closed"}
    - {name: score_on_scale, type: data, read_only: true, no_copy: true, label: Scored, description: "Its score on the workspace's scale when it closed"}
    - {name: grade, type: select, options: [Missed, Progress Made, Achieved], read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Its score against the workspace's grades when it closed"}
    - {name: notes, type: text}
  actions:
    - {name: close_objective, label: Close It, permission: write, condition: "doc.status == 'Active'"}
  list: {columns: [title, owner, parent, cycle, level, ends_on, progress, status], sort: ends_on asc}

- name: KeyResult
  label: Key Result
  label_plural: Key Results
  kind: master
  module: objectives
  title_field: title
  description: How an objective is measured, from a start to a target. Check-ins move it, typed by its owner or measured from the records; its progress is how far along that way it is.
  fields:
    - {name: objective, type: link, to: Objective, required: true, in_list: true, in_filter: true}
    - {name: objective_private, type: check, fetch_from: objective.private, read_only: true, hidden: true, no_copy: true, description: "Its objective is private (kept in step with it)"}
    - {name: title, type: data, required: true, in_list: true}
    - {name: kind, type: select, options: [Increase, Decrease, Milestone], default: Increase, required: true, in_list: true}
    - {name: start_value, type: decimal, default: 0}
    - {name: target_value, type: decimal, default: 1}
    - {name: current_value, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: unit, type: data, description: "customers, %, days"}
    - {name: weight, type: decimal, default: 1, in_list: true, description: "How much it counts towards its objective's progress, against the others there; 0 for not at all"}
    - {name: progress, type: percent, read_only: true, no_copy: true, in_list: true}
    - {name: confidence, type: select, options: [On Track, At Risk, Off Track], read_only: true, no_copy: true, in_list: true, in_filter: true, description: "From the last check-in"}
    - {name: last_check_in, type: date, read_only: true, no_copy: true, description: "The day of its latest check-in"}
    - {name: owner, type: email, in_list: true, in_filter: true, description: "Who checks in on it and is reminded to: its objective's owner, unless someone is named"}
    - {name: measure, type: json, widget: studio_query, label: Measured From, description: "A Studio query of one measure, ungrouped, as a metric is defined. When set, it is measured from the records with its owner's rights: each day, and at each check-in"}
    - {name: check_in_every, type: int, default: 7, label: Check In Every (Days), description: "Days without a check-in before its owner is reminded; 0 for never. One measured from the records needs no reminding"}
    - {name: reminded_on, type: date, read_only: true, no_copy: true, description: "When its owner was last reminded to check in"}
    - {name: measured_on, type: date, read_only: true, no_copy: true, hidden: true}
    - {name: score, type: percent, read_only: true, no_copy: true, description: "Its progress when its objective closed"}
    - {name: score_on_scale, type: data, read_only: true, no_copy: true, label: Scored, description: "Its score on the workspace's scale when its objective closed"}
    - {name: grade, type: select, options: [Missed, Progress Made, Achieved], read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Its score against the workspace's grades when its objective closed"}
    - {name: measure_error, type: text, read_only: true, no_copy: true, description: "Why it could not be measured from the records the last time the day's measure was taken"}
    - {name: projects, type: table, of: KeyResultProject, description: "The work that moves it"}
  list: {columns: [objective, title, owner, current_value, target_value, progress, confidence], sort: created_at asc}

- name: CheckIn
  label: Check-in
  label_plural: Check-ins
  kind: master
  module: objectives
  title_field: key_result
  description: Where a key result stands on a day, and how confident its owner is; its latest by day is the key result's. A key result measured from the records has its value measured, not typed.
  fields:
    - {name: key_result, type: link, to: KeyResult, required: true, in_list: true, in_filter: true}
    - {name: objective_private, type: check, fetch_from: key_result.objective_private, read_only: true, hidden: true, no_copy: true, description: "Its objective is private (kept in step with it)"}
    - {name: date, type: date, required: true, in_list: true}
    - {name: value, type: decimal, in_list: true, description: "For a milestone, 1 when it is done. Left empty for a key result measured from the records: it is measured when the check-in is saved"}
    - {name: confidence, type: select, options: [On Track, At Risk, Off Track], default: On Track, required: true, in_list: true}
    - {name: note, type: text}
    - {name: author, type: email, read_only: true, no_copy: true}
    - {name: measured, type: check, read_only: true, no_copy: true, in_list: true, description: "Its value was measured from the records, with the key result's owner's rights"}
  list: {columns: [key_result, date, value, measured, confidence, author], sort: date desc}

- name: ObjectivesSettings
  label: Objectives Settings
  kind: settings
  module: objectives
  description: "How a closed objective's score is told: on which scale, and from what score it has made progress or is achieved."
  fields:
    - {name: scale, type: select, options: ["0 to 100", "0.0 to 1.0", "1 to 5", "Letters"], default: "0 to 100", required: true, description: "0.0 to 1.0 is scoring as many teams grade objectives and key results; 1 to 5 runs evenly from 1 (nothing) to 5 (all); Letters are A from 90, B from 80, C from 70, D from 60, F below"}
    - {name: progress_from, type: percent, default: 40, required: true, label: Progress Made From, description: "A score from here is Progress Made; below it, Missed"}
    - {name: achieved_from, type: percent, default: 70, required: true, label: Achieved From, description: "A score from here is Achieved"}
